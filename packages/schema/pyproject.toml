[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "billcommons-schema"
version = "0.1.0"
description = "SQLAlchemy models + Alembic migrations for Bill Commons (single source of truth)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
]

[tool.hatch.build.targets.wheel]
packages = ["billcommons_schema"]
