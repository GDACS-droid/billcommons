[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "billcommons-ingest"
version = "0.1.0"
description = "Bill Commons ingestion workers: job queue, registry seed, Open States bulk CSV + v3 API adapters, coverage recompute"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "httpx",
    "pypdf",
    "billcommons-schema",
    "billcommons-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["billcommons_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
